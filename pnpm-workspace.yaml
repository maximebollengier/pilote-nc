packages:
  - "apps/*"

# Refuse d'installer une version publiée il y a moins de 2 semaines
# (mitigation supply-chain : laisse le temps de détecter un package compromis)
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 20160
# https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  # Versions récentes épinglées (correctifs de sécurité) : exclues de la quarantaine
  - next-auth
  - "@auth/core"
  - deepmerge-ts
