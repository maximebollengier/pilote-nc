name: "Déploiement Keycloak (Scaleway)"

on:
  push:
    branches: [main]
    paths:
      - "apps/pilote-nc/keycloak/**"
      - ".github/workflows/deploy-keycloak-scaleway.yml"
  workflow_dispatch:

concurrency:
  group: deploy-keycloak-scaleway
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCW_DEFAULT_REGION: fr-par
  REGISTRY: rg.fr-par.scw.cloud
  IMAGE: rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/keycloak-pilote

jobs:
  deploy:
    name: "Build et déploiement"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/pilote-nc/keycloak
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          export-config: true

      - name: "Déploiement du Serverless Container Keycloak"
        run: |
          set -euo pipefail
          scw container container update "${{ vars.SCW_KEYCLOAK_CONTAINER_ID }}" \
            image="${IMAGE}:${{ github.sha }}"
          # `update image=…` lance déjà un nouveau déploiement : on attend son issue
          # (pause : le statut peut encore afficher l'ancienne révision « ready »).
          sleep 20
          for _ in $(seq 1 60); do
            JSON=$(scw container container get "${{ vars.SCW_KEYCLOAK_CONTAINER_ID }}" -o json)
            STATE=$(echo "${JSON}" | jq -r '.status')
            echo "état : ${STATE}"
            case "${STATE}" in
              ready) exit 0 ;;
              error) echo "${JSON}" | jq -r '.error_message' >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Délai dépassé pendant le déploiement" >&2
          exit 1
