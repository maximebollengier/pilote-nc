# Pile complète pour tester pilote-nc dans des conteneurs (ou point de départ
# pour un hébergement simple). Depuis apps/pilote-nc :
#
#   cp .env.docker.example .env.docker      # puis renseigner les valeurs
#   docker compose --env-file .env.docker up --build -d
#
# Démo avec données de test + connexion par mot de passe (DEV_PASSWORD) :
#   docker compose --env-file .env.docker run --rm migrate pnpm exec prisma db seed
#
# Keycloak local optionnel (realm/client à créer à la main) :
#   docker compose --env-file .env.docker --profile keycloak up -d keycloak

name: pilote-nc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pilote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-pilote_nc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique les migrations Prisma puis s'arrête.
  migrate:
    build:
      context: ../..
      dockerfile: apps/pilote-nc/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pilote}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pilote_nc}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: apps/pilote-nc/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pilote}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pilote_nc}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET requis (openssl rand -base64 32)}
      # Laisser vide en production : force le passage par Keycloak.
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_ISSUER:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requis}
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  db-data:
  keycloak-data:
